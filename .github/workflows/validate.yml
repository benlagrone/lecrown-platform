name: Validate Development Workspace

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/frontend/admin/package-lock.json
      - run: ./scripts/platform.sh setup
      - run: ./scripts/platform.sh verify
        env:
          PYTHON_DOTENV_DISABLED: '1'
          DATABASE_URL: 'sqlite:///:memory:'
